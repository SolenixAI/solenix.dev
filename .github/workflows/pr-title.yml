# A pull request's title becomes main's commit subject (squash merges), so every title is checked when it is set or
# changed: one plain sentence, sentence case, no commit-type prefix, no closing full stop (lib/pr-title.ts).
# The title reaches the script through the environment, never through the shell line, so no title can run as code.
name: pr-title
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
jobs:
  title:
    name: Pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The rule comes from the base branch, so a pull request cannot change the rule that judges its own title.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --no-warnings scripts/pr-title.ts
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

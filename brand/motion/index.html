<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>Solenix · motion piece</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400..800&family=JetBrains+Mono:wght@500;700&display=block">
<style>html,body{margin:0;background:#0b0d12;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Solenix · "three-body problem" motion piece, 1080x1920. Every frame is a pure function of t (seconds).
   window.renderFrame(t) draws one frame; window.ready resolves once fonts, logos, physics and camera are baked. */
const W = 1080, H = 1920, FPS = 30, DUR = 20.0
const out = document.getElementById('c'), ox = out.getContext('2d')
const scene = document.createElement('canvas'); scene.width = W; scene.height = H
const accum = document.createElement('canvas'); accum.width = W; accum.height = H
const trailCv = document.createElement('canvas'); trailCv.width = W; trailCv.height = H
const bloomA = Object.assign(document.createElement('canvas'), { width: 270, height: 480 })
const bloomB = Object.assign(document.createElement('canvas'), { width: 135, height: 240 })
let cx = scene.getContext('2d')
const C = { night: '#0b0d12', paper: '#f4f2ee', ember: '#f59e0b', gold: '#fbbf24', sunE: '#f97316', green: '#34d399', ink: '#1a1206' }
const BODY = [{ name: 'REVENUE', a: '#fde68a', b: '#fbbf24', rgb: '251,191,36' }, { name: 'COSTS', a: '#fdba74', b: '#f97316', rgb: '249,115,22' }, { name: 'TIME', a: '#ffffff', b: '#e8e4dc', rgb: '244,242,238' }]
const TOOLS = ['shopify', 'quickbooks', 'microsoftexcel', 'meta', 'hubspot', 'gmail']
const T = { TOOLS: 4.65, FREEZE: 8.4, BLACK: 8.62, IGNITE: 9.1, LOCK0: 9.3, LOCK: 11.6, TILT0: 12.6, TILT1: 14.2, LOGO: 16.2, LOGO1: 16.95, MARK: 17.2 }

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const lerp = (a, b, t) => a + (b - a) * t
const seg = (t, a, b) => clamp((t - a) / (b - a))
const sm = (x) => x * x * (3 - 2 * x)
const eOutExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x))
const eInExpo = (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10))
const eOutBack = (x, s = 1.9) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2)
const eIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2)
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296) }

/* ---------- physics, baked ---------- */
const SUB = 8, NF = Math.round(DUR * FPS) + 2, NS = NF * SUB
const P = [new Float32Array(NS * 2), new Float32Array(NS * 2), new Float32Array(NS * 2)]
// Six tools on a flat ellipse, vertices on the horizontal axis.
const TOOLPOS = TOOLS.map((_, k) => { const a = k * Math.PI / 3; return [Math.cos(a) * 1.75, Math.sin(a) * 1.75 * 0.8] })
const rate = (t) => (t < 2.4 ? 1.55 : t < T.TOOLS ? 1.25 : t < T.FREEZE ? lerp(1.3, 2.6, seg(t, 6.2, T.FREEZE)) : t < T.IGNITE ? 0 : 1.65)
const F8T = 6.32591398, F8N = 4096, F8 = [new Float32Array(F8N * 2), new Float32Array(F8N * 2), new Float32Array(F8N * 2)], F8S = 1.45
function accel(p, o) {
  const a = [[0, 0], [0, 0], [0, 0]]
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) if (i !== j) {
    const dx = p[j][0] - p[i][0], dy = p[j][1] - p[i][1], r2 = dx * dx + dy * dy + o.eps, f = 1 / (r2 * Math.sqrt(r2))
    a[i][0] += dx * f; a[i][1] += dy * f
  }
  if (o.tools) for (let i = 0; i < 3; i++) for (const [tx, ty] of TOOLPOS) {
    const dx = tx - p[i][0], dy = ty - p[i][1], r2 = dx * dx + dy * dy + 0.09, f = o.tools / (r2 * Math.sqrt(r2))
    a[i][0] += dx * f; a[i][1] += dy * f
  }
  if (o.k) for (let i = 0; i < 3; i++) { a[i][0] -= o.k * p[i][0]; a[i][1] -= o.k * p[i][1] * 0.8 }
  return a
}
const f8at = (b, simT) => { const ph = ((simT % F8T) + F8T) % F8T / F8T * F8N, i0 = Math.floor(ph) % F8N, i1 = (i0 + 1) % F8N, fr = ph - Math.floor(ph); return [lerp(F8[b][i0 * 2], F8[b][i1 * 2], fr) * F8S, lerp(F8[b][i0 * 2 + 1], F8[b][i1 * 2 + 1], fr) * F8S] }
function bake() {
  { let p = [[0.97000436, -0.24308753], [-0.97000436, 0.24308753], [0, 0]], v = [[0.466203685, 0.43236573], [0.466203685, 0.43236573], [-0.93240737, -0.86473146]]
    const steps = F8N * 16, dt = F8T / steps
    for (let s = 0; s <= steps; s++) {
      if (s % 16 === 0 && s / 16 < F8N) for (let b = 0; b < 3; b++) { F8[b][(s / 16) * 2] = p[b][0]; F8[b][(s / 16) * 2 + 1] = p[b][1] }
      const a = accel(p, { eps: 0 }); for (let b = 0; b < 3; b++) { v[b][0] += a[b][0] * dt / 2; v[b][1] += a[b][1] * dt / 2; p[b][0] += v[b][0] * dt; p[b][1] += v[b][1] * dt }
      const a2 = accel(p, { eps: 0 }); for (let b = 0; b < 3; b++) { v[b][0] += a2[b][0] * dt / 2; v[b][1] += a2[b][1] * dt / 2 }
    } }
  let p = [[-1.9, -1.5], [2.0, 1.2], [0.3, 2.1]], v = [[1.25, 1.0], [-1.15, -0.4], [-0.3, -1.35]]
  let sp = null, sv = null
  for (let f = 0; f < NF; f++) for (let s = 0; s < SUB; s++) {
    const t = (f + s / SUB) / FPS, k = f * SUB + s, dtr = 1 / FPS / SUB
    const dts = rate(t) * dtr, n = 6, dt = dts / n
    const tools = t > T.TOOLS + 0.25 && t < T.FREEZE ? 0.9 * sm(seg(t, T.TOOLS + 0.25, T.TOOLS + 1.0)) : 0
    const kk = lerp(0.42, 0.3, seg(t, T.TOOLS, 5.2))
    for (let i = 0; i < n; i++) {
      const a = accel(p, { eps: 0.05, tools, k: kk })
      for (let b = 0; b < 3; b++) { v[b][0] += a[b][0] * dt; v[b][1] += a[b][1] * dt; v[b][0] *= 0.99985; v[b][1] *= 0.99985; p[b][0] += v[b][0] * dt; p[b][1] += v[b][1] * dt }
    }
    for (let b = 0; b < 3; b++) { P[b][k * 2] = p[b][0]; P[b][k * 2 + 1] = p[b][1] }
    if (t >= T.LOCK0) {
      // The AI steers: an underdamped spring pulls each body onto its slot on the figure-eight, overshoots, locks.
      if (!sp) { sp = p.map((q) => [...q]); sv = v.map((q) => [q[0] * 1.65, q[1] * 1.65]) }
      const simT = (t - T.LOCK0) * 1.65, w = lerp(3, 11, seg(t, T.LOCK0, T.LOCK)), z = 0.6
      for (let b = 0; b < 3; b++) {
        const [tx, ty] = f8at(b, simT)
        const ax = (tx - sp[b][0]) * w * w - 2 * z * w * sv[b][0], ay = (ty - sp[b][1]) * w * w - 2 * z * w * sv[b][1]
        sv[b][0] += ax * dtr; sv[b][1] += ay * dtr; sp[b][0] += sv[b][0] * dtr; sp[b][1] += sv[b][1] * dtr
        const e = seg(t, T.LOCK - 0.25, T.LOCK)
        P[b][k * 2] = lerp(sp[b][0], tx, e); P[b][k * 2 + 1] = lerp(sp[b][1], ty, e)
      }
    }
  }
  bakeCamera()
}
const pos = (b, t) => { const k = clamp(Math.round(t * FPS * SUB), 0, NS - 1); return [P[b][k * 2], P[b][k * 2 + 1]] }

/* ---------- camera: baked auto-framing in the hook, authored after ---------- */
const CAM = []
function bakeCamera() {
  let c = { x: 0, y: 0, zoom: 260 }, v = { x: 0, y: 0, zoom: 0 }, om = 5
  for (let f = 0; f < NF; f++) {
    const t = f / FPS
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9
    for (let b = 0; b < 3; b++) { const [x, y] = pos(b, t); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y) }
    const band = t < 2.4 ? 620 : 900
    const tgt = { x: (x0 + x1) / 2, y: (y0 + y1) / 2, zoom: clamp(Math.min(0.74 * W / (x1 - x0 + 0.6), band / (y1 - y0 + 0.6)), 190, 300) }
    if (f === 0) c = { ...tgt }
    for (const k of ['x', 'y', 'zoom']) { const a = (tgt[k] - c[k]) * om * om - 2 * om * v[k]; v[k] += a / FPS; c[k] += v[k] / FPS }
    CAM.push({ ...c })
  }
}
const KICKS = [0, 0.37, 0.5, 2.0, 3.25, 3.5, 5.0, 5.5, 6.0, 8.4, 9.1, 9.2, 9.7, 11.6, 13.2, 17.2, ...TOOLS.map((_, i) => T.TOOLS + i * 0.12 + 0.3)]
function kick(t) { let k = 0; for (const s of KICKS) { const d = t - s; if (d >= 0 && d < 0.25) k += (1 - d / 0.25) ** 2 } return k }
function camAt(t) {
  const f = clamp(Math.round(t * FPS), 0, NF - 1)
  const toolsCam = (u) => ({ x: 0, y: 0.05, zoom: lerp(242, 226, seg(u, T.TOOLS, T.FREEZE)), rot: lerp(0, -0.05, seg(u, T.TOOLS, T.FREEZE)), pitch: 0, cy: 0.40, shake: 6 * seg(u, 6.4, T.FREEZE) })
  if (t < 4.4) return { ...CAM[f], rot: lerp(-0.06, 0.02, seg(t, 0, 4.4)), pitch: 0, cy: 0.46, shake: 0 }
  if (t < 5.1) { const a = { ...CAM[f], rot: 0.02, pitch: 0, cy: 0.46, shake: 0 }, b = toolsCam(t), e = eIO(seg(t, 4.4, 5.1)); const c = {}; for (const k in b) c[k] = lerp(a[k], b[k], e); return c }
  if (t < T.IGNITE) return toolsCam(Math.min(t, T.FREEZE))
  const ti = Math.min(t, T.LOGO), tilt = eIO(seg(ti, T.TILT0, T.TILT1))
  return { x: 0, y: 0, zoom: lerp(330, 300, eOutExpo(seg(ti, T.IGNITE, 10.4))) * (1 + 0.24 * tilt), rot: lerp(0, -Math.PI / 2, tilt), pitch: lerp(0, 52 * Math.PI / 180, tilt), cy: lerp(0.47, 0.52, tilt), shake: 0 }
}
// World (x, y in the plane; z into the scene) -> screen. Returns [sx, sy, scale].
const D = 8
function toScreen(cam, x, y, t, z = 0) {
  const ex = x - cam.x, ey = y - cam.y, cr = Math.cos(cam.rot), sr = Math.sin(cam.rot)
  const xr = ex * cr - ey * sr, yr = ex * sr + ey * cr, th = cam.pitch || 0
  const Y = yr * Math.cos(th) + z * Math.sin(th), Zd = D - yr * Math.sin(th) + z * Math.cos(th)
  const f = D * cam.zoom, k = kick(t), r = rng(Math.floor(t * FPS) * 31 + 5), j = cam.shake + k * 14
  return [W / 2 + xr * f / Zd + j * (r() - 0.5), H * cam.cy + Y * f / Zd + j * (r() - 0.5), D / Zd, Zd]
}

/* ---------- assets ---------- */
let LOGO = {}, STARS = [], GRAIN = [], DUST = [], BOKEH = []
async function loadAssets() {
  const logos = await (await fetch('logos.json')).json()
  for (const k of TOOLS) LOGO[k] = logos[k].paths.map((d) => new Path2D(d))
  const r = rng(7)
  for (let i = 0; i < 1300; i++) STARS.push({ x: r() * 2 - 1, y: r() * 2 - 1, z: 0.15 + r() * 0.85, s: r(), tw: r() * 6.28 })
  for (let i = 0; i < 60; i++) DUST.push({ x: r() * 1.4 - 0.7, y: r() * 1.4 - 0.7, z: 1.6 + r() * 1.4, s: 2 + r() * 5 })
  for (let i = 0; i < 25; i++) BOKEH.push({ x: r(), y: r(), r: 20 + r() * 40, p: r() * 6.28 })
  for (let g = 0; g < 4; g++) { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'), d = x.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255 } x.putImageData(d, 0, 0); GRAIN.push(c) }
  await document.fonts.load('800 200px Sora'); await document.fonts.load('650 120px Sora'); await document.fonts.load('600 52px Sora'); await document.fonts.load('700 40px "JetBrains Mono"')
}

/* ---------- world layers ---------- */
function glow(x, y, r, color, a) {
  if (r <= 0) return
  const g = cx.createRadialGradient(x, y, 0, x, y, r)
  g.addColorStop(0, color.replace('A', a)); g.addColorStop(1, color.replace('A', 0))
  cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r, 0, 6.2832); cx.fill()
}
function drawBackground(t, cam) {
  const g = cx.createRadialGradient(W * 0.5, H * 0.44, 0, W * 0.5, H * 0.44, H * 0.78)
  g.addColorStop(0, '#161b27'); g.addColorStop(1, C.night)
  cx.fillStyle = g; cx.fillRect(0, 0, W, H)
  for (const s of STARS) {
    const px = W / 2 + (s.x * 1.25 * W - cam.x * cam.zoom * s.z * 0.25 + Math.sin(cam.rot) * s.y * 200 * s.z), py = H / 2 + (s.y * 1.1 * H - cam.y * cam.zoom * s.z * 0.25)
    const a = (0.22 + 0.55 * s.s) * (0.7 + 0.3 * Math.sin(t * 2.2 + s.tw)) * s.z, rr = 0.7 + s.z * 2 * s.s
    cx.fillStyle = `rgba(244,242,238,${a.toFixed(3)})`; cx.fillRect(px, py, rr, rr)
  }
  cx.globalCompositeOperation = 'lighter'
  for (const b of BOKEH) glow(b.x * W + Math.sin(t * 0.3 + b.p) * 30, b.y * H, b.r, 'rgba(251,191,36,A)', 0.06)
  cx.globalCompositeOperation = 'source-over'
}
function wells(t) {
  const w = []
  for (let b = 0; b < 3; b++) { const [x, y] = pos(b, t); w.push([x, y, 0.36, 0.55]) }
  const on = seg(t, T.TOOLS, T.TOOLS + 0.8)
  if (on > 0 && t < T.LOGO) for (let i = 0; i < 6; i++) { const [x, y] = toolWorld(i, t); w.push([x, y, 0.42 * on, 0.5]) }
  const sun = eOutExpo(seg(t, T.IGNITE, T.IGNITE + 0.6))
  if (sun > 0) w.push([0, 0, 0.95 * sun, 1.0])
  return w
}
function drawGrid(t, cam) {
  const W8 = wells(t), N = 38, span = 6, step = span * 2 / N
  const ring = t >= T.IGNITE ? (40 + eOutExpo(seg(t, T.IGNITE, T.IGNITE + 1.1)) * 1100) / cam.zoom : -9, ringOn = t >= T.IGNITE && t < T.IGNITE + 1.1
  const lockFlash = Math.round((t - T.LOCK) * FPS) === 0 ? 2 : 1
  const fadeG = 1 - sm(seg(t, 16.4, 17.3))
  if (fadeG <= 0) return
  const base = (t < T.FREEZE ? 0.2 : 0.22) * lockFlash * fadeG
  cx.lineWidth = 1.8
  const warp = (x, y) => {
    let dx = 0, dy = 0, depth = 0
    for (const [wx, wy, m, s] of W8) { const ex = x - wx, ey = y - wy, r2 = ex * ex + ey * ey, f = m * Math.exp(-r2 / (s * s)); dx -= ex * f * 0.55; dy -= ey * f * 0.55; depth += f }
    if (ringOn) { const r = Math.hypot(x, y) + 1e-6, q = (r - ring) / 0.35, rip = 0.12 * Math.sin((r - ring) * 14) * Math.exp(-q * q); dx += (x / r) * rip; dy += (y / r) * rip }
    return [x + dx, y + dy, depth]
  }
  for (let dir = 0; dir < 2; dir++) for (let i = 0; i <= N; i++) {
    const c0 = -span + i * step
    cx.beginPath(); let hot = 0, near = 0, started = false
    for (let j = 0; j <= 110; j++) {
      const u = -span + (j / 110) * span * 2, [x, y, d] = dir ? warp(c0, u) : warp(u, c0)
      const [sx, sy, , Zd] = toScreen(cam, x, y, t, 0.6 * d)
      if (Zd < 2) { started = false; continue }
      hot = Math.max(hot, d); near = Math.max(near, clamp((13 - Zd) / 6))
      if (started) cx.lineTo(sx, sy); else { cx.moveTo(sx, sy); started = true }
    }
    const h = clamp(hot * 1.6)
    cx.strokeStyle = `rgba(${Math.round(lerp(150, 249, h))},${Math.round(lerp(160, 158, h))},${Math.round(lerp(190, 60, h))},${((base + h * 0.24 * fadeG) * near).toFixed(3)})`
    cx.stroke()
  }
}
function drawTrails(t, cam, len, clean) {
  const tx = trailCv.getContext('2d'); tx.clearRect(0, 0, W, H); tx.lineCap = 'round'; tx.lineJoin = 'round'
  for (let b = 0; b < 3; b++) {
    const k1 = Math.round(t * FPS * SUB), k0 = Math.max(0, k1 - len), pts = []
    for (let k = k0; k <= k1; k++) {
      const [x, y] = toScreen(cam, P[b][k * 2], P[b][k * 2 + 1], t)
      const last = pts[pts.length - 1]
      if (!last || Math.hypot(x - last[0], y - last[1]) > 0.5 || k === k1) pts.push([x, y])
    }
    for (let i = 1; i < pts.length; i++) {
      const u = i / (pts.length - 1)
      tx.strokeStyle = `rgba(${BODY[b].rgb},${(u * u * (b === 2 ? 0.75 : 0.9)).toFixed(3)})`
      tx.lineWidth = (clean ? 3 : 2) + u * (clean ? 9 : 15)
      tx.beginPath(); tx.moveTo(pts[i - 1][0], pts[i - 1][1]); tx.lineTo(pts[i][0], pts[i][1]); tx.stroke()
    }
  }
  cx.globalCompositeOperation = 'lighter'; cx.drawImage(trailCv, 0, 0); cx.globalCompositeOperation = 'source-over'
}
function drawBody(b, x, y, r) {
  cx.globalCompositeOperation = 'lighter'
  glow(x, y, r * 6, `rgba(${BODY[b].rgb},A)`, 0.2)
  glow(x, y, r * 2.4, 'rgba(255,236,190,A)', 0.24)
  cx.globalCompositeOperation = 'source-over'
  const g = cx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r)
  g.addColorStop(0, BODY[b].a); g.addColorStop(1, BODY[b].b)
  cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r, 0, 6.2832); cx.fill()
}
function drawSun(x, y, r, t, a = 1, brand = 0) {
  if (r <= 0) return
  cx.globalCompositeOperation = 'lighter'
  glow(x, y, r * 5, 'rgba(249,115,22,A)', 0.22 * a)
  glow(x, y, r * 2.2, 'rgba(255,240,200,A)', 0.3 * a)
  // Corona rays, slowly turning.
  cx.strokeStyle = `rgba(255,236,190,${(0.16 * a).toFixed(3)})`; cx.lineWidth = 3
  for (let i = 0; i < 12; i++) { const ang = i * Math.PI / 6 + (t - T.IGNITE) * 0.25; cx.beginPath(); cx.moveTo(x + Math.cos(ang) * r * 1.15, y + Math.sin(ang) * r * 1.15); cx.lineTo(x + Math.cos(ang) * r * 2.4, y + Math.sin(ang) * r * 2.4); cx.stroke() }
  cx.globalCompositeOperation = 'source-over'
  const g = cx.createRadialGradient(x - r * 0.12, y - r * 0.18, r * 0.04, x, y, r)
  if (brand > 0.5) { g.addColorStop(0, C.gold); g.addColorStop(1, C.sunE) } else { g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, '#fff3c4'); g.addColorStop(1, C.sunE) }
  cx.globalAlpha = a; cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r, 0, 6.2832); cx.fill(); cx.globalAlpha = 1
}
// Name tags: 36 px mono pills, measured first, kept on screen, pushed apart if they overlap.
function pills(list, t) {
  cx.font = '700 34px "JetBrains Mono"'; cx.letterSpacing = '4px'
  const items = list.map((p) => { const w = cx.measureText(p.text).width + 78; return { ...p, w, h: 64, x: clamp(p.x, w / 2 + 48, W - w / 2 - 48) } }).sort((a, b) => a.y - b.y)
  for (let i = 1; i < items.length; i++) for (let j = 0; j < i; j++) { const a = items[j], b = items[i]; if (Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < b.h + 8) b.y = a.y + b.h + 8 }
  for (const p of items) {
    const s = eOutBack(seg(t, p.t0, p.t0 + 0.28)); if (s <= 0) continue
    cx.save(); cx.translate(p.x, p.y); cx.scale(s, s)
    cx.fillStyle = 'rgba(11,13,18,0.85)'; cx.strokeStyle = 'rgba(244,242,238,0.24)'; cx.lineWidth = 2
    cx.beginPath(); cx.roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 32); cx.fill(); cx.stroke()
    cx.fillStyle = p.dot; cx.beginPath(); cx.arc(-p.w / 2 + 28, 0, 8, 0, 6.2832); cx.fill()
    cx.fillStyle = C.paper; cx.textBaseline = 'middle'; cx.textAlign = 'left'; cx.fillText(p.text, -p.w / 2 + 48, 2)
    cx.restore()
  }
  cx.letterSpacing = '0px'
}

/* ---------- tools ---------- */
function toolWorld(i, t) {
  const [bx, by] = TOOLPOS[i]
  let s = 1
  const t0 = T.TOOLS + i * 0.12, p = seg(t, t0, t0 + 0.32)

  let fill = color
  if (grad) { const g = cx.createLinearGradient(ax, 0, ax + w, 0); g.addColorStop(0, C.gold); g.addColorStop(1, C.sunE); fill = g }
  const draw = (s, a, ddy) => {
    cx.save(); cx.globalAlpha = a

}

    else if (f > 0 && f < 4) {
      let x = W / 2, y = H * 0.47
      if (s < 1) { const c = camAt(t); let mx = 0, my = 0; for (let b = 0; b < 3; b++) { const [sx, sy] = toScreen(c, ...pos(b, t), t); mx += sx / 3; my += sy / 3 } x = mx; y = my }
      cx.globalCompositeOperation = 'lighter'; glow(x, y, 900, 'rgba(255,240,215,A)', [0, 0.55, 0.25, 0.1][f]); cx.globalCompositeOperation = 'source-over'
    }
  }
}
function composite(t) {
  const cam = camAt(t)
  if (!(t >= T.BLACK && t < T.IGNITE)) { bloom(); dust(t, cam) }
  if (t < T.LOGO || t >= T.LOGO) storyType(t)
  finish(t)
}

/* ---------- the frame, with shutter blur on fast moments ---------- */
function needsBlur(t) {
  const f = Math.round(t * FPS)
  for (const s of [0.37, T.FREEZE, T.IGNITE]) if (Math.abs(Math.round(s * FPS) - f) < 4) return false
  return kick(t) > 0.3 || (t > 4.4 && t < 5.2) || (t > 16.1 && t < 17.2)
}
window.renderFrame = function (t) {
  if (needsBlur(t)) {
    const ac = accum.getContext('2d'); ac.globalAlpha = 1; ac.clearRect(0, 0, W, H)
    for (let i = 0; i < 5; i++) { drawScene(t - (i / 4) / 60); ac.globalAlpha = 1 / (i + 1); ac.drawImage(scene, 0, 0) }
    ac.globalAlpha = 1; cx.setTransform(1, 0, 0, 1, 0, 0); cx.globalCompositeOperation = 'source-over'; cx.drawImage(accum, 0, 0)
  } else drawScene(t)
  composite(t)
  ox.drawImage(scene, 0, 0)
}
window.EVENTS = { DUR, FPS, T, KICKS }
window.ready = loadAssets().then(() => { bake(); lobeMap(); window.renderFrame(0); return true })
</script>
